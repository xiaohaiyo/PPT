<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写作助手</title><link rel="stylesheet" href="app.css?v=20261016-scroll3"><link rel="stylesheet" href="app-v2.css?v=20261016-scroll3"></head>
<body><header><div class="brand"><span>✓</span>写作助手</div><div class="status"><i id="dot"></i><span><b id="mode">连接中</b><small id="capabilities"></small></span></div></header>
<main><aside class="sources"><h2>写作来源</h2><label class="drop" id="drop"><strong>＋ 添加资料</strong><small>PDF、DOCX、TXT、Markdown，支持拖拽</small><input id="files" type="file" multiple accept=".pdf,.docx,.txt,.md"></label><textarea id="paste" placeholder="也可以直接粘贴文字素材…"></textarea><div class="row"><h3>素材</h3><label class="include-kb"><input type="checkbox" id="includeKb"> 纳入知识库</label><button class="link" id="clear">清空</button></div><div id="fileList" class="file-list"><p class="empty">尚未添加素材</p></div><button class="link kb-add" id="addSelectedKb">将已选素材加入知识库</button><div class="row kb-title"><h3>引用知识库</h3><button class="link" id="createKb">新建知识库</button></div><div id="kbList" class="file-list"><p class="empty">暂无知识库</p></div></aside>
<section class="workspace"><div id="conversation" class="conversation"><div class="welcome"><div class="spark">✦</div><h1>让资料变成清晰的表达</h1><p>导入素材后，可以先分析和讨论，再确认需要生成的内容。</p></div></div><form id="chat" class="composer"><input id="question" placeholder="询问资料，或说明想生成什么…"><button>发送</button></form></section>
<aside class="outputs"><div class="row"><div><small>产物中心</small><h2>生成记录</h2></div></div><div id="skills" class="tabs"></div><div class="record-scope">按产物类型查看历史、进度与结果</div><div class="row records-title"><h3 id="recordTitle">演讲文稿</h3><small id="recordCount">0 项</small></div><div id="records" class="records"><p class="empty">暂无记录</p></div></aside></main>
<dialog id="preview"><div class="dialog-head"><h2 id="previewTitle"></h2><div><button id="revise">基于此修改</button><button id="editToggle" hidden>编辑源码</button><button id="saveEdit" hidden>保存修改</button><button id="exportAlt" hidden></button><button id="exportPng" hidden>导出 PNG</button><button id="download">下载产物</button><button id="close">关闭</button></div></div><div id="artifactCitations" class="artifact-citations" hidden></div><iframe id="slidePreview" title="产物预览"></iframe><pre id="textPreview"></pre></dialog>
<dialog id="kbManager"><form id="kbManagerForm"><div class="dialog-head"><h2>管理知识库</h2><div><button type="submit" class="primary">保存</button><button type="button" id="kbManagerClose">取消</button></div></div><div class="kb-editor"><label class="field">名称<input id="kbName" maxlength="80" required></label><h3>知识库资料</h3><div id="kbDocuments" class="kb-documents"></div></div></form></dialog>
<div id="toast"></div><script type="module" src="app.js?v=20261016-scroll3"></script></body></html>
